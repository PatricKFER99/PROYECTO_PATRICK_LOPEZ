<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración | Inventario</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background-color: var(--crema); font-family: 'Open Sans', sans-serif; padding: 40px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1 style="color: var(--verde-sirena); font-family: 'Montserrat', sans-serif;">Gestión de Inventario (Administrador)</h1>
        <a href="index.html" class="btn-primary" style="text-decoration: none; width: auto;">Volver a la tienda</a>
    </div>
    
    <div style="display: flex; gap: 30px; flex-wrap: wrap;">
        <!-- Formulario CRUD -->
        <div style="flex: 1; min-width: 300px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
            <h3 style="color: var(--cafe-oscuro); margin-bottom: 20px;">Agregar / Editar Producto</h3>
            <form id="form-producto">
                <input type="hidden" id="prod-id">
                
                <label style="font-weight: bold; color: var(--gris-texto);">Nombre del producto:</label>
                <input type="text" id="prod-nombre" required style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                
                <label style="font-weight: bold; color: var(--gris-texto);">Descripción:</label>
                <textarea id="prod-desc" required rows="3" style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; resize: none;"></textarea>
                
                <label style="font-weight: bold; color: var(--gris-texto);">Precio (S/):</label>
                <input type="number" step="0.01" id="prod-precio" required style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                
                <label style="font-weight: bold; color: var(--gris-texto);">Categoría (1=Cafés, 2=Postres, 3=Jugos):</label>
                <input type="number" id="prod-cat" required min="1" max="3" style="width: 100%; margin-bottom: 25px; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                
                <button type="submit" class="btn-primary" style="border-radius: 8px;">Guardar en Inventario</button>
                <button type="button" onclick="limpiarFormulario()" style="width: 100%; background: #ccc; border: none; padding: 12px; border-radius: 8px; margin-top: 10px; cursor: pointer; font-weight: bold;">Cancelar / Limpiar</button>
            </form>
        </div>

        <!-- Tabla de Inventario -->
        <div style="flex: 2; min-width: 500px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); overflow-x: auto;">
            <h3 style="color: var(--cafe-oscuro); margin-bottom: 20px;">Stock Actual</h3>
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background-color: var(--verde-sirena); color: white;">
                        <th style="padding: 12px; text-align: left;">ID</th>
                        <th style="padding: 12px; text-align: left;">Producto</th>
                        <th style="padding: 12px; text-align: left;">Precio</th>
                        <th style="padding: 12px; text-align: left;">Cat.</th>
                        <th style="padding: 12px; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos">
                    <tr><td colspan="5" style="text-align: center; padding: 20px;">Conectando a Supabase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de conexión directa a Supabase -->
    <script type="module">
        import { supabase } from './conexion.js';

        // 1. LEER: Cargar el inventario
        async function cargarInventario() {
            const { data, error } = await supabase.from('t_producto').select('*').order('id_producto', { ascending: true });
            const tbody = document.getElementById('tabla-productos');
            
            if (error) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Error al cargar inventario</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            data.forEach(prod => {
                const id = prod.id_producto || prod.id;
                tbody.innerHTML += `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 12px; color: var(--gris-texto);">${id}</td>
                        <td style="padding: 12px; font-weight: bold;">${prod.nombre}</td>
                        <td style="padding: 12px;">S/ ${prod.precio.toFixed(2)}</td>
                        <td style="padding: 12px;">${prod.id_catalogo}</td>
                        <td style="padding: 12px; text-align: center;">
                            <button onclick="editarProd('${id}', '${prod.nombre}', '${prod.descripcion}', ${prod.precio}, ${prod.id_catalogo})" style="background: #f0ad4e; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-right: 5px;">Editar</button>
                            <button onclick="eliminarProd('${id}')" style="background: #d9534f; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer;">Borrar</button>
                        </td>
                    </tr>
                `;
            });
        }

        // 2. CREAR / ACTUALIZAR: Guardar producto
        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const producto = {
                nombre: document.getElementById('prod-nombre').value,
                descripcion: document.getElementById('prod-desc').value,
                precio: parseFloat(document.getElementById('prod-precio').value),
                id_catalogo: parseInt(document.getElementById('prod-cat').value)
            };

            if (id) {
                await supabase.from('t_producto').update(producto).eq('id_producto', id);
                alert("✅ Producto actualizado en el inventario.");
            } else {
                await supabase.from('t_producto').insert([producto]);
                alert("✅ Nuevo producto agregado al inventario.");
            }
            
            limpiarFormulario();
            cargarInventario();
            sessionStorage.removeItem('catalogoStarbucksV5'); // Forzar actualización en la tienda
        });

        // 3. BORRAR: Eliminar producto
        window.eliminarProd = async (id) => {
            if(confirm("¿Estás seguro de que deseas eliminar este producto del inventario?")) {
                await supabase.from('t_producto').delete().eq('id_producto', id);
                cargarInventario();
                sessionStorage.removeItem('catalogoStarbucksV5'); // Forzar actualización en la tienda
            }
        }

        // 4. Llenar formulario para editar
        window.editarProd = (id, nombre, desc, precio, cat) => {
            document.getElementById('prod-id').value = id;
            document.getElementById('prod-nombre').value = nombre;
            document.getElementById('prod-desc').value = desc;
            document.getElementById('prod-precio').value = precio;
            document.getElementById('prod-cat').value = cat;
        }

        window.limpiarFormulario = () => {
            document.getElementById('form-producto').reset();
            document.getElementById('prod-id').value = '';
        }

        cargarInventario();
    </script>
</body>
</html>
